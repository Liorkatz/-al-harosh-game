<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <title>מעדכן את על הראש</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #08111f; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    main { width: min(420px, 100%); text-align: center; padding: 28px; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: linear-gradient(155deg,#13233d,#08111f 72%); box-shadow: 0 28px 90px rgba(0,0,0,.45); }
    .spinner { width: 46px; height: 46px; margin: 0 auto 18px; border: 4px solid rgba(255,255,255,.16); border-top-color: #facc15; border-radius: 50%; animation: spin .75s linear infinite; }
    h1 { margin: 0 0 8px; font-size: 1.45rem; }
    p { margin: 0; color: #cbd5e1; line-height: 1.55; }
    .error { color: #fecaca; margin-top: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>מעדכן לגרסה החדשה…</h1>
    <p id="statusText">מאמת את הגרסה החדשה ומנקה את הגרסה הישנה.</p>
  </main>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const version = params.get('version') || '1.2.7';
      const stamp = Date.now().toString();
      const status = document.getElementById('statusText');
      const target = new URL('./app-current.html', location.href);
      target.searchParams.set('v', version);
      target.searchParams.set('fresh', stamp);

      try {
        status.textContent = 'בודק שהגרסה החדשה באמת זמינה…';
        const response = await fetch(target.toString(), {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const html = await response.text();
        if (!html.includes(`data-app-version="${version}"`)) {
          throw new Error(`Server page is not version ${version}`);
        }

        status.textContent = 'מנקה את המטמון הישן…';
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('al-harosh-')).map(key => caches.delete(key)));
        }

        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister().catch(() => false)));
        }

        // Mark installed only after the target page was verified as the requested version.
        localStorage.setItem('alHaroshInstalledVersion', version);
        localStorage.setItem('alHaroshInstalledAt', new Date().toISOString());

        status.textContent = 'העדכון הושלם. פותח את המשחק…';
        location.replace(target.toString());
      } catch (error) {
        status.className = 'error';
        status.textContent = `העדכון לא סומן כהושלם כי הגרסה החדשה לא אומתה. (${error.message})`;
        console.error('iPhone update verification failed', error);
      }
    })();
  </script>
</body>
</html>
