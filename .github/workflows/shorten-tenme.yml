name: Create verified external short link
on:
  push:
    paths:
      - ".github/workflows/shorten-tenme.yml"
jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create and verify
        shell: bash
        run: |
          set -u
          TARGET='https://liorkatz.github.io/-al-harosh-game/tenme/'

          verify() {
            local short="$1"
            [[ "$short" =~ ^https?:// ]] || return 1
            local final
            final="$(curl -A 'Mozilla/5.0' -Ls --max-time 20 -o /dev/null -w '%{url_effective}' "$short" || true)"
            echo "CANDIDATE=$short"
            echo "FINAL=$final"
            if [[ "$final" == "$TARGET" ]]; then
              echo "VERIFIED_SHORT_URL=$short"
              echo "::notice title=TENME_SHORT_URL::$short"
              exit 0
            fi
          }

          C1="$(curl -fsS --max-time 20 --get 'https://clck.ru/--' --data-urlencode "url=$TARGET" || true)"
          verify "$C1" || true

          C2="$(curl -fsS --max-time 20 --get 'https://da.gd/s' --data-urlencode "url=$TARGET" || true)"
          verify "$C2" || true

          C3="$(curl -fsS --max-time 20 --get 'https://tinyurl.com/api-create.php' --data-urlencode "url=$TARGET" || true)"
          verify "$C3" || true

          echo "No verified shortener succeeded"
          exit 1
