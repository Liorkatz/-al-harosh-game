name: Create external short link
on:
  push:
    paths:
      - ".github/workflows/shorten-tenme.yml"
jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create short URL
        shell: bash
        run: |
          TARGET='https://liorkatz.github.io/-al-harosh-game/tenme/'
          RES="$(curl -fsS -X POST -d "url=$TARGET" 'https://cleanuri.com/api/v1/shorten')"
          SHORT="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("result_url",""))' <<< "$RES")"
          if [[ "$SHORT" != https://cleanuri.com/* ]]; then
            echo "$RES"
            exit 1
          fi
          echo "SHORT_URL=$SHORT"
          echo "::notice title=TENME_SHORT_URL::$SHORT"
