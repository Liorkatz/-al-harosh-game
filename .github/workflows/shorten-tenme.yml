name: Verify external short link
on:
  push:
    paths:
      - ".github/workflows/shorten-tenme.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify redirect
        shell: bash
        run: |
          SHORT='https://cleanuri.com/31zwJl'
          FINAL="$(curl -Ls -o /dev/null -w '%{url_effective}' "$SHORT")"
          CODE="$(curl -Ls -o /dev/null -w '%{http_code}' "$SHORT")"
          echo "SHORT_URL=$SHORT"
          echo "FINAL_URL=$FINAL"
          echo "HTTP_CODE=$CODE"
          if [[ "$FINAL" != 'https://liorkatz.github.io/-al-harosh-game/tenme/' ]]; then
            exit 1
          fi
