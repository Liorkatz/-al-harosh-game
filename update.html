<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#08111f" />
  <title>מעדכן את על הראש</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #08111f; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    main { width: min(420px, 100%); text-align: center; padding: 28px; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: linear-gradient(155deg,#13233d,#08111f 72%); box-shadow: 0 28px 90px rgba(0,0,0,.45); }
    .spinner { width: 46px; height: 46px; margin: 0 auto 18px; border: 4px solid rgba(255,255,255,.16); border-top-color: #facc15; border-radius: 50%; animation: spin .75s linear infinite; }
    h1 { margin: 0 0 8px; font-size: 1.45rem; }
    p { margin: 0; color: #cbd5e1; line-height: 1.55; }
    .error { color: #fecaca; margin-top: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>מעדכן לגרסה החדשה…</h1>
    <p id="statusText">מנקה את הגרסה הישנה וטוען עותק חדש ישירות מהשרת.</p>
  </main>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const version = params.get('version') || '';
      const stamp = Date.now().toString();
      const status = document.getElementById('statusText');

      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('al-harosh-')).map(key => caches.delete(key)));
        }

        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister().catch(() => false)));
        }

        status.textContent = 'מוריד את הגרסה החדשה…';

        // iOS keeps an already-open PWA controlled by the old Service Worker until that
        // document is gone. Fetch the fresh HTML from a different origin so the stale
        // same-origin cache cannot supply index.html again.
        const rawUrl = `https://raw.githubusercontent.com/Liorkatz/-al-harosh-game/main/index.html?fresh=${stamp}`;
        const response = await fetch(rawUrl, { cache: 'no-store', mode: 'cors' });
        if (!response.ok) throw new Error(`Fresh HTML HTTP ${response.status}`);
        const html = await response.text();
        if (!html.includes('data-app-version=')) throw new Error('Fresh HTML is invalid');

        const next = new URL('./index.html', location.href);
        if (version) next.searchParams.set('updated', version);
        next.searchParams.set('fresh', stamp);

        // Change the visible/current URL without navigating through the stale controller.
        history.replaceState(null, '', next.toString());
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.className = 'error';
        status.textContent = 'העדכון לא הושלם. סגור את המשחק לגמרי ופתח שוב, ואז נסה פעם נוספת.';
        console.error('Update bridge failed', error);
      }
    })();
  </script>
</body>
</html>
